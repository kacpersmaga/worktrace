[project]
name = "worktrace"
version = "1.0.0"
description = "Process and task mining engine behind the WorkTrace dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.18",
    "pandas>=2.2",
    "numpy>=2.0",
    "networkx>=3.4",
    "scikit-learn>=1.6",
    "pydantic>=2.10",
    "google-genai>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worktrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
